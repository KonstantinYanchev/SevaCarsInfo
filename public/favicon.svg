<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="100" height="100" rx="20" fill="#0A0A0A"/>
  
  <!-- Racing red accent -->
  <rect x="10" y="10" width="80" height="80" rx="15" fill="#DC2626" opacity="0.1"/>
  
  <!-- Gear symbol -->
  <g transform="translate(50, 50)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#DC2626" stroke-width="4"/>
    <circle cx="0" cy="0" r="10" fill="#DC2626"/>
    <!-- Gear teeth -->
    <rect x="-2" y="-26" width="4" height="8" fill="#DC2626"/>
    <rect x="-2" y="18" width="4" height="8" fill="#DC2626"/>
    <rect x="-26" y="-2" width="8" height="4" fill="#DC2626"/>
    <rect x="18" y="-2" width="8" height="4" fill="#DC2626"/>
  </g>
  
  <!-- S letter -->
  <text x="50" y="60" font-family="'Bebas Neue', Impact, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle">S</text>
</svg>
