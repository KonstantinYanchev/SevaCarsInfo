<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background shape - hexagonal automotive theme -->
  <path d="M30 10 L50 5 L70 10 L75 30 L70 50 L50 55 L30 50 L25 30 Z" fill="#DC2626" opacity="0.1"/>
  
  <!-- Main logo container -->
  <rect x="20" y="15" width="160" height="50" rx="4" fill="url(#metalGradient)" opacity="0.05"/>
  
  <!-- Gear/wrench symbol -->
  <g transform="translate(30, 25)">
    <!-- Gear -->
    <circle cx="15" cy="15" r="8" fill="none" stroke="#DC2626" stroke-width="2"/>
    <circle cx="15" cy="15" r="4" fill="#DC2626"/>
    <rect x="14" y="7" width="2" height="4" fill="#DC2626"/>
    <rect x="14" y="19" width="2" height="4" fill="#DC2626"/>
    <rect x="7" y="14" width="4" height="2" fill="#DC2626"/>
    <rect x="19" y="14" width="4" height="2" fill="#DC2626"/>
  </g>
  
  <!-- SEVA text -->
  <text x="60" y="37" font-family="'Bebas Neue', Impact, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" letter-spacing="2">SEVA</text>
  
  <!-- CARS text -->
  <text x="60" y="53" font-family="'Bebas Neue', Impact, sans-serif" font-size="16" fill="#DC2626" letter-spacing="3">CARS</text>
  
  <!-- Speed line accent -->
  <line x1="130" y1="28" x2="170" y2="28" stroke="#DC2626" stroke-width="2" opacity="0.5"/>
  <line x1="135" y1="33" x2="165" y2="33" stroke="#DC2626" stroke-width="1.5" opacity="0.3"/>
  <line x1="140" y1="38" x2="160" y2="38" stroke="#DC2626" stroke-width="1" opacity="0.2"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
